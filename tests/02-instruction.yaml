- description: 指令-只输出指定词
  vars:
    category: 指令遵循
    input: 请只输出两个字：通过。不要输出任何其他内容。
  assert:
    - type: javascript
      value: |
        const t = output.trim().replace(/["'“”‘’。！!、\s]/g, '');
        return t === '通过';

- description: 指令-三个要点且每点不超十个字
  vars:
    category: 指令遵循
    input: 用三个要点说明节约用水的方法，每点不超过十个字，只输出这三个要点。
  assert:
    - type: javascript
      value: |
        const lines = output.split(/\n+/).map((l) => l.trim()).filter(Boolean);
        const items = lines.filter((l) => /^([-*•]|\d+[.、)])\s*/.test(l));
        if (items.length !== 3) return false;
        return items.every((l) => l.replace(/^([-*•]|\d+[.、)])\s*/, '').replace(/[。，,.!！、]/g, '').length <= 10);

- description: 指令-禁止出现指定词
  vars:
    category: 指令遵循
    input: 用两句话说明早起的好处，回答中不要出现“但是”这两个字。
  assert:
    - type: not-icontains
      value: 但是

- description: 指令-只用英文回答
  vars:
    category: 指令遵循
    input: What is machine learning? Answer in English only.
  assert:
    - type: javascript
      value: |
        const cjk = (output.match(/[\u4e00-\u9fa5]/g) || []).length;
        const latin = (output.match(/[a-zA-Z]/g) || []).length;
        return latin > 40 && cjk <= 2;

- description: 指令-改写不超过二十字
  vars:
    category: 指令遵循
    input: 把这句话改写得更简短，不超过20个字，只输出改写结果：我非常喜欢在周末的时候去附近的公园里散步。
  assert:
    - type: javascript
      value: |
        const t = output.replace(/["'“”‘’\s]/g, '');
        return t.length >= 4 && t.length <= 22;

- description: 指令-正好三个列表项
  vars:
    category: 指令遵循
    input: 列出三个常用的命令行工具，用无序列表输出，不要解释，也不要多余内容。
  assert:
    - type: javascript
      value: |
        const lines = output.split(/\n+/).map((l) => l.trim()).filter(Boolean);
        const items = lines.filter((l) => /^([-*•]|\d+[.、)])\s*/.test(l));
        return items.length === 3;

- description: 指令-用表格对比
  vars:
    category: 指令遵循
    input: 用 Markdown 表格对比 Python 和 JavaScript 在类型系统、运行环境、主要用途三个方面的差异。
  assert:
    - type: javascript
      value: |
        const lines = output.split(/\n/);
        const hasPipe = output.includes('|');
        const hasSep = lines.some((l) => /\|\s*:?-{3,}/.test(l));
        return hasPipe && hasSep && /Python/i.test(output) && /JavaScript/i.test(output);

- description: 指令-先给结论
  vars:
    category: 指令遵循
    input: 先说结论，再解释理由：新手学编程应该先学 Python 还是 JavaScript？
  assert:
    - type: javascript
      value: |
        const head = output.slice(0, 60);
        return /结论|建议|推荐|应该/.test(head);

- description: 指令-只回答是或否
  vars:
    category: 指令遵循
    input: 1+1=3 吗？只回答“是”或“否”，不要解释。
  assert:
    - type: regex
      value: "^\\s*否[。.!！]?\\s*$"

- description: 指令-字母顺序输出单词
  vars:
    category: 指令遵循
    input: 按英文字母顺序输出 apple、banana、orange 这三个单词，用逗号分隔，不要解释。
  assert:
    - type: javascript
      value: |
        const t = output.toLowerCase();
        const i = t.indexOf('apple');
        const j = t.indexOf('banana');
        const k = t.indexOf('orange');
        return i >= 0 && j > i && k > j;
